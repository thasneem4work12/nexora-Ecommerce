services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-postgres
    restart: always
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: nexora_db
    ports:
      - "5432:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexora_pgdata:
